name: Build APK

# Gera o APK na nuvem a cada push na main (a máquina aqui não compila Android).
# Release assinado com a chave de DEBUG (instala direto no celular).
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      - name: Dependências
        run: flutter pub get

      - name: Chave de assinatura (secrets -> keystore + key.properties)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=upload
          EOF

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Publica o APK como Release (v0.1.0, sobrescreve a cada build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          # Nome VERSIONADO do APK (à prova de cache: cada versão é um download
          # distinto, então o navegador nunca serve um APK antigo).
          cp build/app/outputs/flutter-apk/app-release.apk "taskix-v${VERSAO}.apk"
          gh release create v0.1.0 \
            --repo "${{ github.repository }}" \
            --title "Taskix v${VERSAO}" \
            --notes "Última versão: v${VERSAO}. Baixe taskix-v${VERSAO}.apk e instale POR CIMA (não desinstale)." \
            || true
          # Atualiza título/notas com a versão atual a cada build.
          gh release edit v0.1.0 \
            --repo "${{ github.repository }}" \
            --title "Taskix v${VERSAO}" \
            --notes "Última versão: v${VERSAO}. Baixe **taskix-v${VERSAO}.apk** e instale POR CIMA (não desinstale)."
          # Sobe o APK versionado + o nome fixo (compatibilidade).
          gh release upload v0.1.0 \
            "taskix-v${VERSAO}.apk" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --clobber