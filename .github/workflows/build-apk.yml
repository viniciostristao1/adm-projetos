name: Build APK

# Gera o APK na nuvem a cada push na main (a máquina aqui não compila Android).
# Release assinado com a chave de DEBUG (instala direto no celular).
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      - name: Dependências
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Publica o APK como Release (v0.1.0, sobrescreve a cada build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            --repo "${{ github.repository }}" \
            --title "ADM-projetos" \
            --notes "APK de teste (assinado com a chave de debug)." \
            || true
          gh release upload v0.1.0 \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --clobber